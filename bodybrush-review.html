<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>電動ボディブラシ レビュー投稿ページへ</title>
<!--
  ▼▼▼ 転送先URLの設定（ここだけ書き換えれば転送先が変わります。QRコードは変更不要）▼▼▼
  ・テスト販売中：テスト販売の商品ページURLを TARGET に入れる
  ・本販売移行時：本販売の商品ページURLに書き換えて再デプロイ
  ・空（""）のままなら「準備中」表示になります
-->
<script>
  var TARGET = "https://judge.me/product_reviews/9f521a34-7778-4642-9a38-2ac103443b95/new?id=7886619344971&source=shareable-link";  // ← レビュー投稿先（Judge.me 電動ボディブラシ レビュー記入フォーム）
  if (TARGET) {
    // 転送先が設定済みなら即リダイレクト
    var m = document.createElement('meta');
    m.httpEquiv = 'refresh';
    m.content = '0;url=' + TARGET;
    document.head.appendChild(m);
    window.location.replace(TARGET);
  }
</script>
<style>
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fafaf8;color:#1a1a1a;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;}
  .box{max-width:420px;text-align:center;background:#fff;border:1px solid #e8e6e1;border-radius:12px;padding:36px 28px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:#2563eb;margin-bottom:14px;}
  h1{font-size:18px;line-height:1.6;margin:0 0 12px;}
  p{font-size:14px;color:#6b6860;line-height:1.9;margin:0;}
  a{color:#2563eb;font-weight:600;}
</style>
</head>
<body>
  <div class="box">
    <h1>レビュー投稿ページは<br>ただいま準備中です</h1>
    <p>ご協力ありがとうございます。<br>商品ページの公開後、こちらから自動でご案内します。<br>もうしばらくお待ちください。</p>
    <noscript><p style="margin-top:14px;">※このページはJavaScriptで自動転送します。</p></noscript>
  </div>
  <script>
    // 転送先未設定時は準備中ページを表示（上のTARGETが空のとき）
  </script>
</body>
</html>
